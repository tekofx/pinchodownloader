name: Build and Release Windows App

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # CAMBIO AQUÍ: Llamamos a packageExe globalmente. Gradle buscará qué módulo la tiene.
      - name: Build Windows EXE
        run: ./gradlew packageExe

      # Buscador dinámico de archivos: Encuentra el .exe sin importar la carpeta del módulo
      - name: Upload EXE to GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Función recursiva para buscar archivos .exe dentro de carpetas de build de Gradle
            function findExeFile(dir) {
              if (!fs.existsSync(dir)) return null;
              
              const files = fs.readdirSync(dir);
              for (const file of files) {
                const fullPath = path.join(dir, file);
                const stat = fs.statSync(fullPath);
                
                if (stat.isDirectory()) {
                  // Evitamos buscar en carpetas irrelevantes para ir más rápido
                  if (file === 'node_modules' || file === '.git' || file === '.gradle') continue;
                  const found = findExeFile(fullPath);
                  if (found) return found;
                } else if (file.endsWith('.exe') && fullPath.includes('compose' + path.sep + 'binaries')) {
                  return fullPath;
                }
              }
              return null;
            }

            const workspace = process.env.GITHUB_WORKSPACE;
            const exePath = findExeFile(workspace);

            if (!exePath) {
              core.setFailed('No se pudo localizar el archivo .exe generado en los directorios de compilación.');
              return;
            }

            const exeFile = path.basename(exePath);
            console.log(`Archivo encontrado: ${exePath}`);
            console.log(`Subiendo asset: ${exeFile}`);

            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: context.payload.release.id,
              name: exeFile,
              data: fs.readFileSync(exePath)
            });
